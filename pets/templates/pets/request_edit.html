{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Request Edit | PetCare Veterinary Clinic</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

<div class="container">

    <div style="text-align:center; margin-bottom:30px;">

        <img src="{% static 'images/logo.png' %}" alt="PetCare Logo" width="180">

        <h1>PetCare Veterinary Clinic</h1>

        <p class="logo-text">
            Healthy Pets, Happier Families
        </p>

    </div>

    <h2 class="section-title">
        Edit Request
    </h2>

    <p style="text-align:center; font-size:22px; margin-bottom:30px;">
       <span style="font-weight:bold; color:#2E86DE;">Pet:</span>
       <span style="font-weight:600; color:#1B4F72;">{{ pet.name }}</span>
    </p>
    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Submit Request
        </button>

    </form>

    <br>

    <div style="text-align:center;">

        <a href="{% url 'pet_list' %}" class="back-btn">
            Back to Home
        </a>

    </div>

</div>

</body>

</html>
